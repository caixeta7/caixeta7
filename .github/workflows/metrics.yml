name: Metrics Update

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM UTC
  workflow_dispatch:

jobs:
  metrics:
    name: Generate metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: caixeta7
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_followup: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_introduction: yes
          plugin_introduction_title: "## 👋 Olá! Sou o Caio"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used, recently-used
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit, pull, issue
          plugin_projects: yes
          plugin_projects_limit: 4
          plugin_repositories: yes
          plugin_repositories_affiliations: owner, collaborator, organization_member
          plugin_repositories_batch: 10
          plugin_repositories_details: lines, commits, issues, percentage
          plugin_repositories_filter_exclude: caixeta7/caixeta7
          plugin_repositories_limit: 4
          plugin_repositories_order: updated
          plugin_repositories_recent_days: 30
          plugin_repositories_visibility: public
          plugin_stargazers: yes
          plugin_stargazers_limit: 4
          plugin_stargazers_order: stars
          plugin_topics: yes
          plugin_topics_limit: 10
          plugin_topics_mode: starred
          output_action: github-readme
          output_insert: "## 📊 Métricas Detalhadas"
          committer_message: "chore: update metrics section"
          commit_message: "chore: update metrics section"